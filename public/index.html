<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Management App</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/start.js"></script>
</head>

<body>
  <div class="app-container">
    <header>
      <h1>Property Management System</h1>
    </header>
    <main id="content">
      <!-- People Section -->
      <section class="entity-section">
        <h2>People</h2>
        <button id="addperson" class="btn-primary">Add Person</button>
        <table id="peopletable" class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th colspan="7">Schedule</th>
              <th>Action</th>
            </tr>
            <tr class="days">
              <th></th>
              <th class="day-1">Mon</th>
              <th class="day-2">Tue</th>
              <th class="day-3">Wed</th>
              <th class="day-4">Thu</th>
              <th class="day-5">Fri</th>
              <th class="day-6">Sat</th>
              <th class="day-7">Sun</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Landlords Section -->
      <section class="entity-section">
        <h2>Landlords</h2>
        <button id="addlandlord" class="btn-primary">Add Landlord</button>
        <table id="landlordtable" class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Notes</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Buildings Section -->
      <section class="entity-section">
        <h2>Buildings</h2>
        <button id="addbuilding" class="btn-primary">Add Building</button>
        <table id="buildingtable" class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Landlord</th>
              <th>Address</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Rooms Section -->
      <section class="entity-section">
        <h2>Rooms</h2>
        <button id="addroom" class="btn-primary">Add Room</button>
        <table id="roomtable" class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Building</th>
              <th>Capacity</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Forms -->
  <div id="personform" class="modal" style="display: none;">
    <div class="modal-content">
      <form>
        <h2>Person</h2>
        <div class="form-group">
          <label for="personform-name">Name</label>
          <input type="text" id="personform-name" required>
        </div>
        <div class="form-group">
          <label for="personform-email">Email</label>
          <input type="email" id="personform-email">
        </div>
        <div class="form-group">
          <label for="personform-notes">Notes</label>
          <textarea id="personform-notes" rows="4"></textarea>
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="close btn-secondary">Close</button>
      </form>
    </div>
  </div>

  <div id="landlordform" class="modal" style="display: none;">
    <div class="modal-content">
      <form>
        <h2>Landlord</h2>
        <div class="form-group">
          <label for="landlordform-name">Name</label>
          <input type="text" id="landlordform-name" required>
        </div>
        <div class="form-group">
          <label for="landlordform-email">Email</label>
          <input type="email" id="landlordform-email">
        </div>
        <div class="form-group">
          <label for="landlordform-notes">Notes</label>
          <textarea id="landlordform-notes" rows="4"></textarea>
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="close btn-secondary">Close</button>
      </form>
    </div>
  </div>

  <div id="buildingform" class="modal" style="display: none;">
    <div class="modal-content">
      <form>
        <h2>Building</h2>
        <div class="form-group">
          <label for="buildingform-name">Name</label>
          <input type="text" id="buildingform-name" required>
        </div>
        <div class="form-group">
          <label for="buildingform-landlordId">Landlord</label>
          <select id="buildingform-landlordId" required></select>
        </div>
        <div class="form-group">
          <label for="buildingform-address">Address</label>
          <input type="text" id="buildingform-address">
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="close btn-secondary">Close</button>
      </form>
    </div>
  </div>

  <div id="roomform" class="modal" style="display: none;">
    <div class="modal-content">
      <form>
        <h2>Room</h2>
        <div class="form-group">
          <label for="roomform-name">Name</label>
          <input type="text" id="roomform-name" required>
        </div>
        <div class="form-group">
          <label for="roomform-buildingId">Building</label>
          <select id="roomform-buildingId" required></select>
        </div>
        <div class="form-group">
          <label for="roomform-capacity">Capacity</label>
          <input type="number" id="roomform-capacity" min="1">
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="close btn-secondary">Close</button>
      </form>
    </div>
  </div>




</body>

</html>
